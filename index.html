<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Metodo Infalible</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=7">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app">

    <!-- SPLASH -->
    <div id="splash-screen" class="splash-screen">
      <img id="splash-logo" src="logo_completo.png" alt="Metodo Infalible" class="splash-logo">
      <div id="splash-bar-track" class="splash-bar-track">
        <div id="splash-bar-fill" class="splash-bar-fill"></div>
      </div>
      <p class="creador">Diseñado y creado por Jose Torres</p>
    </div>

    <!-- LOGIN -->
    <div id="login-screen" class="login-screen" style="display:none;">
      <div class="login-box">
        <img src="logo_completo.png" alt="Metodo Infalible" class="login-logo-img">

        <label for="login-email">Correo</label>
        <input type="email" id="login-email" placeholder="nombre@correo.com" autocomplete="email">

        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" placeholder="********" autocomplete="current-password">

        <button id="btn-login">Entrar</button>
        <p id="login-error" class="login-error"></p>
      </div>
      <p class="login-footer">Acceso restringido, solo administradores</p>
      <p class="creador">Diseñado y creado por Jose Torres</p>
    </div>

    <!-- APP -->
    <div id="main-app" style="display:none;">
      <header class="hdr">
        <div class="brand">
          <img src="icon-192.png" alt="">
          <span>Método infalible</span>
        </div>
        <button id="btn-logout" class="ib" aria-label="Salir">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2"/><path d="M9 12h12l-3-3m0 6l3-3"/></svg>
        </button>
      </header>

      <main id="vista"></main>

      <div id="builder-slot"></div>

      <nav class="nav" id="nav" aria-label="Principal">
        <button class="ni on" data-vista="hoy">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l-2 0l9 -9l9 9l-2 0"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/><path d="M9 21v-6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v6"/></svg>
          Hoy
        </button>
        <button class="ni" data-vista="manana">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16M10 16h4M12 14l2 2l-2 2"/></svg>
          Mañana
        </button>
        <button class="ni" data-vista="resultados">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3l8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
          Resultados
        </button>
        <button class="ni" data-vista="stats">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M15 9a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1z"/><path d="M9 5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1z"/><path d="M4 20h14"/></svg>
          Estadísticas
        </button>
      </nav>
    </div>

  </div>

  <div id="sheet-root"></div>

  <script src="app.js?v=7"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>
</body>
</html>
