<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Metodo Infalible</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app">

    <!-- PANTALLA DE LOGIN -- se muestra sola hasta que el login sea correcto -->
    <div id="login-screen" class="login-screen">
      <div class="login-box">
        <div class="login-logo">
          <img src="icon-192.png" alt="logo" width="64" height="64">
        </div>
        <p class="login-title">Metodo infalible</p>
        <p class="login-subtitle">Pronosticos over 2.5</p>

        <label for="login-email">Correo</label>
        <input type="email" id="login-email" placeholder="nombre@correo.com" autocomplete="email">

        <label for="login-password">Contrasena</label>
        <input type="password" id="login-password" placeholder="********" autocomplete="current-password">

        <button id="btn-login">Entrar</button>
        <p id="login-error" class="login-error"></p>
      </div>
      <p class="login-footer">Acceso restringido - solo administradores</p>
    </div>

    <!-- APP REAL -- oculta hasta que el login sea correcto -->
    <div id="main-app" style="display:none;">
      <header>
        <h1>Metodo infalible</h1>
        <div class="header-right">
          <p class="subtitle">Pronosticos over 2.5</p>
          <button id="btn-logout">Salir</button>
        </div>
      </header>

      <main>
        <section class="card">
          <label for="dia-selector">Ver partidos de:</label>
          <select id="dia-selector">
            <option value="0">Hoy</option>
            <option value="1" selected>Mañana</option>
            <option value="2">Pasado mañana</option>
          </select>
        </section>

        <div id="combo-resultado"></div>
        <div id="resultados"></div>
      </main>

      <footer>
        <p>Analisis pre-partido -- no garantiza resultados. Gestion de banca es tu responsabilidad.</p>
      </footer>
    </div>

  </div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>
</body>
</html>
