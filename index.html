<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Metodo Infalible</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app">

    <!-- SPLASH -- se muestra primero, siempre, unos segundos -->
    <div id="splash-screen" class="splash-screen">
      <img id="splash-logo" src="logo_completo.png" alt="logo" class="splash-logo">
      <div id="splash-bar-track" class="splash-bar-track">
        <div id="splash-bar-fill" class="splash-bar-fill"></div>
      </div>
      <p class="creador">Diseñado y creado por Jose Torres</p>
    </div>

    <!-- LOGIN -- oculta hasta que termine el splash -->
    <div id="login-screen" class="login-screen" style="display:none;">
      <div class="login-box">
        <img src="logo_completo.png" alt="logo" class="login-logo-img">

        <label for="login-email">Correo</label>
        <input type="email" id="login-email" placeholder="nombre@correo.com" autocomplete="email">

        <label for="login-password">Contrasena</label>
        <input type="password" id="login-password" placeholder="********" autocomplete="current-password">

        <button id="btn-login">Entrar</button>
        <p id="login-error" class="login-error"></p>
      </div>
      <p class="login-footer">Acceso restringido - solo administradores</p>
      <p class="creador">Diseñado y creado por Jose Torres</p>
    </div>

    <!-- APP -- oculta hasta login correcto -->
    <div id="main-app" style="display:none;">
      <header>
        <div class="header-left">
          <img src="icon-192.png" alt="logo" class="header-logo">
          <div>
            <p class="header-title">Metodo infalible</p>
          </div>
        </div>
        <i id="btn-logout" class="ti ti-logout" aria-label="Salir"></i>
      </header>

      <div class="tabs">
        <div class="tab tab-activo" data-dia="0">Hoy</div>
        <div class="tab" data-dia="1">Mañana</div>
        <div class="tab" data-dia="2">Pasado</div>
      </div>

      <div style="padding:0 16px 14px;">
        <button id="btn-analizar" style="background:#22c55e;color:#062712;font-size:13px;font-weight:600;padding:10px;border-radius:8px;border:none;width:100%;cursor:pointer;">Analizar ahora</button>
        <p id="analizar-mensaje" style="font-size:11px;color:#64748b;margin-top:6px;text-align:center;"></p>
      </div>

      <main>
        <div id="combo-resultado"></div>
        <div id="resultados"></div>
      </main>

      <footer>
        <p>Analisis pre-partido -- no garantiza resultados. Gestion de banca es tu responsabilidad.</p>
        <p class="creador">Diseñado y creado por Jose Torres</p>
      </footer>
    </div>

  </div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>
</body>
</html>
